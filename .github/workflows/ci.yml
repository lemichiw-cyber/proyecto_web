name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:build

  # Prueba de humo con Playwright: build carga, SW se registra,
  # funciona offline, sin errores en consola.
  # Simula respuestas del backend para evitar fallos de red en CI.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: |
          npx serve -s dist -l 4173 &
          SERVER_PID=$!
          sleep 3
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const context = await browser.newContext();
              const page = await context.newPage();

              // Interceptar peticiones al backend y responder con mocks
              // para que el test no dependa de red externa (Render)
              await page.route('**/api/**', async (route) => {
                const url = route.request().url();
                if (url.includes('/api/health')) {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ ok: true, ytmusic: { authenticated: false } }) });
                } else if (url.includes('/api/music/search')) {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ songs: [] }) });
                } else if (url.includes('/api/music/stream/')) {
                  await route.fulfill({ status: 206, headers: { 'Content-Type': 'audio/mpeg', 'Accept-Ranges': 'bytes' }, body: Buffer.from('') });
                } else {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: '{}' });
                }
              });

              const errors = [];
              page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
              page.on('pageerror', e => errors.push(e.message));

              try {
                await page.goto('http://localhost:4173', { waitUntil: 'networkidle', timeout: 30000 });

                // SW registrado
                const swReg = await page.evaluate(() => navigator.serviceWorker.ready.then(r => r.active.scriptURL));
                if (!swReg) throw new Error('Service Worker no registrado');
                console.log('SW activo:', swReg);

                // Sin errores en consola
                if (errors.length) throw new Error('Errores en consola: ' + errors.join('; '));

                // Offline: recargar con networkidle (simula cache)
                await page.goto('http://localhost:4173', { waitUntil: 'networkidle', timeout: 30000 });
                console.log('OK: build carga, SW registrado, sin errores, offline OK');
              } catch (e) {
                console.error('FALLO:', e.message);
                process.exit(1);
              } finally {
                await browser.close();
              }
            })();
          "
          kill $SERVER_PID