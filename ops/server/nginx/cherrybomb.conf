# ===================================================================
# cherrybomb — sitio de producción (nginx)
#
# Topología: TODO en el mismo servidor y el mismo dominio.
#   /            → la PWA compilada (dist/) servida por nginx
#   /api/*       → proxy al backend FastAPI en 127.0.0.1:8000
#
# Como el frontend y la API comparten origen:
#   * no hace falta CORS,
#   * no hace falta el permiso de "acceso a la red local" (LNA),
#   * la cookie de sesión va con SameSite=Lax (la normal).
#
# INSTALACIÓN
#   sudo cp ops/server/nginx/cherrybomb.conf /etc/nginx/sites-available/cherrybomb
#   sudo ln -s /etc/nginx/sites-available/cherrybomb /etc/nginx/sites-enabled/cherrybomb
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt)
#   sudo certbot --nginx -d cherrybomb.io -d www.cherrybomb.io
#   (certbot reescribe este archivo para agregar el bloque de TLS)
#
# NOTAS DE COMPATIBILIDAD
#   * "listen 443 ssl http2" funciona en nginx 1.22 (Debian 12) y en 1.26
#     (Debian 13). La forma nueva "http2 on;" NO existe en 1.22.
#   * El control de caché usa la directiva `expires` (y no `add_header`)
#     porque `add_header` dentro de un `location` hace que se PIERDAN las
#     cabeceras heredadas del `server` (HSTS, CSP, X-Frame-Options…).
#   * Reemplazá CHERRYBOMB_DOMAIN por tu dominio real.
#   * El backend NO se expone a internet: uvicorn escucha en 127.0.0.1.
#   * El proxy manda X-Forwarded-Proto para que el backend sepa que la
#     petición llegó por HTTPS (HSTS y cookie Secure).
# ===================================================================

server {
    listen 80;
    listen [::]:80;
    server_name CHERRYBOMB_DOMAIN;

    # Renovación de certificados: se deja pasar sin redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHERRYBOMB_DOMAIN;

    # Certificado inicial: el "snakeoil" de Debian (paquete ssl-cert).
    # Hace falta porque nginx NO arranca con `listen 443 ssl` sin
    # certificado. `certbot --nginx` reemplaza estas dos rutas por las
    # definitivas.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    root /srv/cherrybomb/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Tamaño máximo de las peticiones (subidas de tareas, imágenes…).
    client_max_body_size 10m;

    # --- Cabeceras de seguridad ---
    # La CSP va acá porque nginx sirve el HTML: la del backend sólo aplica
    # a las respuestas de la API.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: blob: data:; worker-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; manifest-src 'self'; frame-ancestors 'self'" always;

    # --- API: proxy al backend ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # La documentación interactiva no se expone en producción.
    location /docs          { return 404; }
    location /redoc         { return 404; }
    location /openapi.json  { return 404; }

    # --- PWA ---
    # index.html y el service worker NO se cachean: si no, los usuarios
    # quedarían pegados a una versión vieja de la app.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /registerSW.js {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires 1h;
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de la SPA (/tareas, /configuracion…): se devuelve index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
